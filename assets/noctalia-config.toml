panel_placement = "attached"

[plugin_settings."noctalia/bitwarden"]
server_url = "https://vaultwarden.patrickcanal.it"

[plugins]
enabled = [ "damian-ds7/battery-threshold", "noctalia/bongocat", "noctalia/timer" ]

[shell]
app_icon_color = "on_surface_variant"
avatar_path = "/home/r3ddy/.face"
corner_radius_scale = 1.0000000149011612
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Catppuccin"
community_palette = "One Dark Two"
custom_palette = "Tokyo Night Moon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "discord", "telegram", "libreoffice", "vscode", "heroiclauncher", "prismlauncher", "steam", "obs", "lazygit" ]

[wallpaper]
directory = "/home/r3ddy/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/r3ddy/Pictures/Wallpapers/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/r3ddy/Pictures/Wallpapers/wallpaper.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/r3ddy/Pictures/Wallpapers/wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/r3ddy/Pictures/Wallpapers/wallpaper.jpg"

[weather]
address = "Bolzano"
refresh_minutes = 60

[widget.audio_visualizer]
bands = 47
color_2 = "secondary"
width = 311

[widget.bar]
type = "noctalia/timer:bar"

[widget.cat]
