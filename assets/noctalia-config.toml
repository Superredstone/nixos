[accessibility]
ui_scale = 0.90000000596046448

[bar.default]
capsule_radius = 0
center = [ "clock" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
margin_edge = 0
margin_ends = 0
radius = 0
start = [ "launcher", "workspaces" ]

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Calendar"
    type = "google"

[desktop_widgets]
